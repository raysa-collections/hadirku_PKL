<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <!-- Gear Metal Metallic Gradients -->
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="gearAccentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="centerBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="wrenchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container for Mobile App Launchers -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="12 8" />

  <!-- MAIN AUTOMOTIVE GEAR (TKR PKL) -->
  <g filter="url(#gearGlow)">
    <!-- 8 Gear Teeth Path -->
    <path d="
      M 230 50 L 282 50 L 288 88 A 170 170 0 0 1 346 112 L 382 98 L 418 134 L 404 170 A 170 170 0 0 1 428 228 L 466 234 L 466 286 L 428 292 A 170 170 0 0 1 404 350 L 418 386 L 382 422 L 346 408 A 170 170 0 0 1 288 432 L 282 470 L 230 470 L 224 432 A 170 170 0 0 1 166 408 L 130 422 L 94 386 L 108 350 A 170 170 0 0 1 84 292 L 46 286 L 46 234 L 84 228 A 170 170 0 0 1 108 170 L 94 134 L 130 98 L 166 112 A 170 170 0 0 1 224 88 Z
    " fill="url(#gearGrad)" stroke="#7dd3fc" stroke-width="4" stroke-linejoin="round" />

    <!-- Inner Metallic Bezel -->
    <circle cx="256" cy="256" r="142" fill="#0f172a" stroke="url(#gearAccentGrad)" stroke-width="10" />
    <circle cx="256" cy="256" r="118" fill="url(#centerBadgeGrad)" stroke="#38bdf8" stroke-width="4" />
  </g>

  <!-- CENTER AUTOMOTIVE WRENCH & ATTENDANCE CHECKMARK SYMBOL -->
  <g transform="translate(256, 256)">
    <!-- Wrench Tool Graphic (Teknik Kendaraan Ringan) -->
    <g transform="rotate(-45)" filter="url(#goldGlow)">
      <!-- Wrench Shaft -->
      <rect x="-14" y="-80" width="28" height="130" rx="8" fill="url(#gearAccentGrad)" stroke="#fef08a" stroke-width="2" />
      
      <!-- Top Wrench Head -->
      <path d="M -34 -70 C -34 -105, 34 -105, 34 -70 C 34 -58, 20 -48, 14 -48 L -14 -48 C -20 -48, -34 -58, -34 -70 Z" fill="url(#gearAccentGrad)" />
      <!-- Top Wrench Opening -->
      <path d="M -12 -96 L 12 -96 L 14 -70 L -14 -70 Z" fill="#0f172a" />

      <!-- Bottom Wrench Ring -->
      <circle cx="0" cy="50" r="28" fill="url(#gearAccentGrad)" />
      <circle cx="0" cy="50" r="14" fill="#0f172a" />
    </g>

    <!-- Prominent Attendance Checkmark (GREEN DISCIPLINE) -->
    <g transform="translate(18, 18)" filter="url(#goldGlow)">
      <circle cx="0" cy="0" r="42" fill="#10b981" stroke="#ffffff" stroke-width="4" />
      <path d="M -16 2 L -6 12 L 18 -12" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom Brand Label Badge -->
  <rect x="136" y="432" width="240" height="42" rx="21" fill="#090d16" stroke="#06b6d4" stroke-width="2" />
  <text x="256" y="459" text-anchor="middle" font-size="20" font-weight="900" fill="#38bdf8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="2">PKL TKR</text>
</svg>